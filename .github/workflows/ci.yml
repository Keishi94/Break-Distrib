name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: breakdistrib
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build:frontend

      - name: Build admin
        run: bun run build:admin

      - name: Type check backend
        run: cd backend && bun run typecheck

      - name: Check DB isolation
        run: |
          if grep -rn "from '../db" backend/src/routes/; then
            echo "Direct DB imports in routes are forbidden. Use services."
            exit 1
          fi

      - name: Run backend tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/breakdistrib"
        run: cd backend && bun run db:push && bun test
